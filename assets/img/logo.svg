<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Vibrant Amber / Gold & Coral Gradient -->
    <linearGradient id="jGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="jGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Clean Rounded Square Base (Pure White / Crisp Edge) -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Geometric Modern 'J' Tech Ribbon -->
  <!-- Top Horizontal Bar with energetic rounded forward taper -->
  <path d="M 44 42 C 44 36.477 48.477 32 54 32 L 108 32 C 113.523 32 118 36.477 118 42 C 118 47.523 113.523 52 108 52 L 68 52 C 60.268 52 54 58.268 54 66 L 54 94 C 54 107.255 64.745 118 78 118 C 91.255 118 102 107.255 102 94 L 102 78 C 102 72.477 106.477 68 112 68 C 117.523 68 122 72.477 122 78 L 122 94 C 122 118.3 102.3 138 78 138 C 53.7 138 34 118.3 34 94 L 34 52 C 34 46.477 38.477 42 44 42 Z" fill="url(#jGradPrimary)"/>

  <!-- High-Tech Energy Spark Dot (Signature Apex) -->
  <circle cx="118" cy="36" r="10" fill="url(#sparkGrad)"/>
  <circle cx="118" cy="36" r="5" fill="#FFFFFF"/>
</svg>
